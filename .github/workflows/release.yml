name: Prepare draft release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact release tag
        id: verify
        shell: powershell
        run: |
          $release = Get-Content app-release.json -Raw | ConvertFrom-Json
          if ($release.version -notmatch '^\d+\.\d+\.\d+$' -or $release.assetName -cne 'WallpaperShell-win-x64.zip') { throw 'Invalid release metadata' }
          if ($env:GITHUB_REF_TYPE -cne 'tag' -or $env:GITHUB_REF_NAME -cne ('v'+$release.version)) { throw 'Run this workflow on the exact existing version tag' }
          if ($release.repository -cne $env:GITHUB_REPOSITORY) { throw 'Release repository does not match public config' }
          'version='+$release.version | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build, test and validate with read-only credentials
        shell: powershell
        run: |
          ./tools/bootstrap-build.ps1
          ./tools/test.ps1
          if (!$?) { throw 'Tests failed' }
          ./bin/node.exe ./tools/check-security.cjs --worktree-only
          if ($LASTEXITCODE -ne 0) { throw 'Security scan failed' }
          ./tools/export-source.ps1 -Destination ./dist/source
          ./tools/package-release.ps1 -SkipBuild -OutputDirectory ./dist/release
          ./tools/validate-update-package.ps1 -ZipPath ./dist/release/WallpaperShell-win-x64.zip -Version (Get-Content app-release.json -Raw | ConvertFrom-Json).version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-release
          path: |
            dist/release/WallpaperShell-win-x64.zip
            dist/release/WallpaperShell-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-release
          path: release
      - name: Verify checksum and create or update a draft only
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $asset = 'WallpaperShell-win-x64.zip'
          if (@(Get-ChildItem release -File).Count -ne 2) { throw 'Unexpected release files' }
          $checksum = (Get-Content -LiteralPath ('release/'+$asset+'.sha256') -Raw).TrimEnd("`r","`n")
          if ($checksum -cnotmatch '^[a-f0-9]{64}  WallpaperShell-win-x64\.zip$') { throw 'Invalid checksum file' }
          if ((Get-FileHash -LiteralPath ('release/'+$asset) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $checksum.Substring(0,64)) { throw 'Release checksum mismatch' }
          $tag = 'v'+$env:RELEASE_VERSION
          $releases = gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing releases' }
          $matching = @($releases | Where-Object { $_.tagName -ceq $tag })
          if ($matching.Count -eq 0) {
            gh release create $tag --draft --verify-tag --title "WallpaperShell $env:RELEASE_VERSION" --notes 'Portable Windows x64 package. Verify checksums and review before publishing.'
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          }
          $existing = gh release view $tag --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$existing.isDraft) { throw 'Refusing to overwrite a published or unreadable release' }
          gh release upload $tag ('release/'+$asset) ('release/'+$asset+'.sha256') --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed' }
