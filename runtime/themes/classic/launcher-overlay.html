</defs></svg><main id="stage">  <section id="launcher" class="launcher" aria-label="Программы и файлы" hidden>
    <div id="launcherRail" class="launcher-rail">
      <div id="launcherHandle" class="launcher-handle">ПРОГРАММЫ <span aria-hidden="true">⠿</span></div>
      <nav id="launcherCategories" class="launcher-categories" aria-label="Категории программ"></nav>
      <div class="launcher-system"><button id="launcherPC" type="button" title="Этот компьютер"><svg class="icon" aria-hidden="true"><use href="#i-screen-one"/></svg><span>ПК</span></button><button id="launcherTrash" type="button" title="Открыть корзину"><svg class="icon" aria-hidden="true"><use href="#i-launch-trash"/></svg><span>Корзина</span></button></div>

    <section id="launcherPanel" class="launcher-panel" aria-label="Содержимое категории" hidden>
      <header><h2 id="launcherTitle"></h2><button id="launcherArrange" type="button" aria-pressed="false">Разложить</button><button id="launcherClose" type="button" aria-label="Закрыть категорию">×</button></header>
      <div id="launcherFileFilters" class="launcher-file-filters" role="group" aria-label="Фильтр по типу файла" hidden>
        <button type="button" data-file-filter="all" aria-pressed="true">Все <small>0</small></button>
        <button type="button" data-file-filter="images" aria-pressed="false">Картинки <small>0</small></button>
        <button type="button" data-file-filter="text" aria-pressed="false" title="Текстовые файлы, PDF и офисные документы">Текст <small>0</small></button>
        <button type="button" data-file-filter="other" aria-pressed="false">Другое <small>0</small></button>
      </div>
      <div id="launcherSelection" class="launcher-selection" role="group" aria-label="Выделение файлов" hidden>
        <button id="launcherSelectMode" type="button" aria-pressed="false" title="Нажимай на файлы, чтобы выбрать несколько">Выбрать</button>
        <button id="launcherSelectAll" type="button">Выделить всё</button>
        <button id="launcherSelectClear" type="button">Снять</button>
        <span id="launcherSelectedCount" role="status" aria-live="polite">Галочки · Ctrl / Shift · рамка</span>
      </div>
      <div class="launcher-scroll-shell">
        <div id="launcherItems" class="launcher-items"></div>
        <div id="launcherScrollbar" class="launcher-scrollbar">
          <button id="launcherScrollUp" type="button" aria-label="Прокрутить вверх">⌃</button>
          <div id="launcherScrollTrack" class="launcher-scroll-track"><button id="launcherScrollThumb" class="launcher-scroll-thumb" type="button" role="scrollbar" aria-label="Прокрутка категории" aria-controls="launcherItems" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></button></div>
          <button id="launcherScrollDown" type="button" aria-label="Прокрутить вниз">⌄</button>
        </div>
      </div>
      <div class="launcher-panel-foot"><span id="launcherCount"></span><button id="launcherDesktop" type="button">Открыть рабочий стол ↗</button></div>
    </section>
    <div id="launcherFeedback" class="launcher-feedback" role="status" aria-live="polite" hidden></div>
  </section>
</main>
